<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#05010d" />
<title>Happy Diwali</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap');

  :root{
    --gold: #ffd36e;
    --gold-soft: #ffe6b0;
    --ink: #05010d;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    font-family:'Poppins', system-ui, -apple-system, sans-serif;
    color:#f6efe3;
    background:
      radial-gradient(120% 90% at 50% 0%, #2a1050 0%, #170a2f 32%, #0a0418 68%, var(--ink) 100%);
    overflow:hidden;
    position:relative;
  }

  /* ---------- Night sky layers ---------- */
  .stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  .star{
    position:absolute;
    border-radius:50%;
    background:#fff;
    opacity:0;
    animation: twinkle var(--dur, 3s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    box-shadow:0 0 6px rgba(255,240,200,.9);
  }
  @keyframes twinkle{
    0%,100%{ opacity:.12; transform:scale(.7); }
    50%    { opacity:1;   transform:scale(1.3); }
  }

  /* ---------- Rotating rangoli ---------- */
  .rangoli{
    position:fixed;
    top:50%; left:50%;
    width:min(94vw, 780px);
    height:min(94vw, 780px);
    transform:translate(-50%,-50%);
    z-index:0;
    opacity:.17;
    pointer-events:none;
    animation: spin 90s linear infinite;
  }
  .rangoli svg{
    width:100%; height:100%; display:block;
    filter: drop-shadow(0 0 14px rgba(255,190,80,.35));
  }
  @keyframes spin{
    to{ transform:translate(-50%,-50%) rotate(360deg); }
  }

  /* ---------- Fireworks canvas ---------- */
  #fireworks{
    position:fixed; inset:0;
    width:100%; height:100%;
    z-index:1;
    pointer-events:none;
  }

  /* ---------- Vignette ---------- */
  .vignette{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(120% 100% at 50% 45%, transparent 42%, rgba(3,0,10,.6) 100%);
  }

  /* ---------- Content ---------- */
  .stage{
    position:relative;
    z-index:3;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px 22px;
    gap:clamp(10px, 1.8vh, 18px);
  }

  .reveal{
    opacity:0;
    transform:translateY(26px);
    animation: reveal .95s cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay: var(--delay, 0ms);
  }
  @keyframes reveal{
    to{ opacity:1; transform:translateY(0); }
  }

  .badge{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:clamp(.58rem, 1.6vw, .72rem);
    font-weight:500;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:#ffd98a;
    padding-left:.42em;
  }
  .badge::before,
  .badge::after{
    content:'';
    width:clamp(22px, 6vw, 56px);
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,211,110,.75));
  }
  .badge::after{
    background:linear-gradient(90deg, rgba(255,211,110,.75), transparent);
  }

  .greeting{
    font-family:'Great Vibes', cursive;
    font-weight:400;
    font-size:clamp(2.4rem, 15vw, 11rem);
    line-height:1.05;
    letter-spacing:.01em;
    white-space:nowrap;
    background:linear-gradient(100deg,
      #ffe9a8 0%, #ffd36e 18%, #fff6c0 34%,
      #ffb347 50%, #ffe9a8 66%, #ffd36e 82%, #fff6c0 100%);
    background-size:250% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    -webkit-text-fill-color:transparent;
    filter: drop-shadow(0 0 18px rgba(255,170,60,.35))
            drop-shadow(0 0 52px rgba(255,120,20,.18));
    opacity:0;
    transform:translateY(26px);
    animation: reveal .95s .18s cubic-bezier(.2,.7,.2,1) forwards,
               shimmer 7s linear infinite;
  }
  @keyframes shimmer{
    0%  { background-position:200% center; }
    100%{ background-position:-200% center; }
  }

  .divider{
    position:relative;
    width:min(260px, 55vw);
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,211,110,.8), transparent);
  }
  .divider::after{
    content:'';
    position:absolute;
    left:50%; top:50%;
    width:8px; height:8px;
    transform:translate(-50%,-50%) rotate(45deg);
    background:radial-gradient(circle, #fff6c0, #ffb347);
    box-shadow:0 0 12px rgba(255,190,80,.9);
  }

  .to{
    font-family:'Great Vibes', cursive;
    font-size:clamp(1.5rem, 4.4vw, 2.3rem);
    color:var(--gold-soft);
    line-height:1.15;
    text-shadow:0 0 18px rgba(255,190,90,.45);
  }

  .message{
    max-width:34rem;
    font-size:clamp(.88rem, 2.3vw, 1.05rem);
    font-weight:300;
    line-height:1.95;
    color:#d8ccbf;
    letter-spacing:.012em;
  }

  .sign{
    font-family:'Great Vibes', cursive;
    font-size:clamp(1.5rem, 4vw, 2.2rem);
    color:#ffd98a;
    margin-top:2px;
    text-shadow:0 0 20px rgba(255,180,70,.4);
  }

  /* ---------- Diya lamps ---------- */
  .diyas{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:clamp(14px, 4.5vw, 46px);
    margin-top:clamp(14px, 3vh, 30px);
  }

  .diya{
    position:relative;
    width:var(--w, 56px);
    height:calc(var(--w, 56px) * .95);
    animation: bob 4.6s ease-in-out infinite;
    animation-delay: var(--bd, 0s);
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%    { transform:translateY(-6px); }
  }

  .diya .glow{
    position:absolute;
    left:50%;
    bottom:calc(var(--w, 56px) * .22);
    width:calc(var(--w, 56px) * 2.4);
    height:calc(var(--w, 56px) * 2.4);
    transform:translate(-50%, 45%);
    background:radial-gradient(circle,
      rgba(255,180,60,.35) 0%,
      rgba(255,120,0,.12) 40%,
      transparent 70%);
    border-radius:50%;
    animation: glowPulse 2.8s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes glowPulse{
    0%,100%{ opacity:.75; transform:translate(-50%,45%) scale(1); }
    50%    { opacity:1;   transform:translate(-50%,45%) scale(1.12); }
  }

  .diya .flame{
    position:absolute;
    left:50%;
    bottom:calc(var(--w, 56px) * .34);
    width:calc(var(--w, 56px) * .22);
    height:calc(var(--w, 56px) * .4);
    transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 78%,
      #fffdf0 0%, #ffe27a 34%, #ffab1f 66%, #ff6a00 86%, rgba(255,80,0,0) 100%);
    border-radius:50% 50% 45% 45% / 62% 62% 38% 38%;
    transform-origin:50% 100%;
    animation: flicker calc(.5s + var(--fs, 0s)) ease-in-out infinite alternate;
    filter: drop-shadow(0 0 10px rgba(255,160,30,.9))
            drop-shadow(0 0 26px rgba(255,110,0,.5));
  }
  @keyframes flicker{
    0%  { transform:translateX(-50%) scale(1,1)        rotate(-2.5deg); }
    100%{ transform:translateX(-50%) scale(1.06,.9)    rotate(2.5deg); }
  }

  .diya .bowl{
    position:absolute;
    bottom:0; left:0;
    width:100%;
    height:calc(var(--w, 56px) * .4);
    background:linear-gradient(180deg, #e08f3f 0%, #a85a1d 45%, #6d3510 100%);
    border-radius:0 0 50% 50% / 0 0 100% 100%;
    box-shadow: inset 0 -4px 8px rgba(0,0,0,.5),
                inset 0 7px 9px rgba(255,200,130,.25),
                0 10px 20px rgba(0,0,0,.5);
  }
  .diya .bowl::before{
    content:'';
    position:absolute;
    top:-2px; left:1%;
    width:98%; height:9px;
    background:radial-gradient(ellipse at center, #ffcf6b 0%, #c06a24 55%, #7a3d12 100%);
    border-radius:50%;
    box-shadow:0 0 9px rgba(255,180,90,.55);
  }

  /* ---------- Hint ---------- */
  .hint{
    position:fixed;
    bottom:16px; left:50%;
    transform:translateX(-50%);
    z-index:4;
    font-size:.68rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:rgba(255,225,170,.55);
    white-space:nowrap;
    pointer-events:none;
    animation: hintFade 8s ease forwards;
  }
  @keyframes hintFade{
    0%  { opacity:0; }
    18% { opacity:.8; }
    70% { opacity:.8; }
    100%{ opacity:0; }
  }

  @media (max-width:480px){
    .message{ line-height:1.8; }
    .stage{ gap:8px; }
  }

  @media (max-height:560px) and (orientation:landscape){
    .stage{ gap:4px; padding:8px 16px; }
    .greeting{ font-size:clamp(2.2rem, 15vh, 4.6rem); }
    .message{ font-size:.74rem; line-height:1.5; max-width:42rem; }
    .sign{ font-size:1.3rem; }
    .divider{ width:min(200px, 40vw); }
    .diyas{ margin-top:4px; }
    .hint{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .rangoli{ animation-duration:300s; }
    .diya, .diya .glow, .diya .flame{ animation-duration:8s; }
  }
</style>
</head>
<body>

  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="rangoli" id="rangoli" aria-hidden="true"></div>
  <canvas id="fireworks" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <div class="badge reveal" style="--delay:60ms">A Festival of Lights</div>

    <h1 class="greeting">Happy Diwali</h1>

    <div class="divider reveal" style="--delay:420ms"></div>

    <p class="to reveal" id="toLine" style="--delay:520ms">To Someone Truly Special</p>

    <p class="message reveal" style="--delay:680ms">
      May the lamps of Diwali fill your life with warmth, your heart with joy,
      and your days with endless light. Wishing you prosperity, peace, and
      moments that glow forever.
    </p>

    <p class="sign reveal" style="--delay:860ms">With love &amp; light</p>

    <div class="diyas" id="diyas" aria-hidden="true"></div>
  </main>

  <div class="hint" aria-hidden="true">Tap anywhere to light up the sky</div>

<script>
  /* =========================================================
     Personalise the greeting here (or use ?name=YourName)
     ========================================================= */
  const CONFIG = {
    name: "",                                  // e.g. "Aarav"
    fallback: "To Someone Truly Special",      // shown when no name
  };

  const params = new URLSearchParams(location.search);
  const name = params.get("name") || CONFIG.name;

  const toLine = document.getElementById("toLine");
  toLine.textContent = name ? `Dear ${name},` : CONFIG.fallback;
  if (name) document.title = `Happy Diwali, ${name}`;

  /* =========================================================
     Twinkling stars
     ========================================================= */
  (function buildStars(){
    const wrap = document.getElementById("stars");
    const frag = document.createDocumentFragment();
    const count = window.innerWidth < 600 ? 90 : 150;

    for (let i = 0; i < count; i++){
      const s = document.createElement("span");
      s.className = "star";
      const size = Math.random() * 2 + 1;
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = Math.random() * 100 + "%";
      s.style.top = Math.random() * 100 + "%";
      s.style.setProperty("--dur", (2 + Math.random() * 3.5).toFixed(2) + "s");
      s.style.setProperty("--delay", (Math.random() * 5).toFixed(2) + "s");
      if (Math.random() > .82){
        s.style.background = "#ffe9a8";
      }
      frag.appendChild(s);
    }
    wrap.appendChild(frag);
  })();

  /* =========================================================
     Rangoli mandala (generated SVG)
     ========================================================= */
  (function buildRangoli(){
    const NS = "http://www.w3.org/2000/svg";
    const host = document.getElementById("rangoli");
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 400 400");

    const cx = 200, cy = 200;
    const gold = "#e9b45a";

    function el(tag, attrs){
      const node = document.createElementNS(NS, tag);
      for (const k in attrs) node.setAttribute(k, attrs[k]);
      return node;
    }

    function petalRing(count, radius, rx, ry, opacity, width){
      for (let i = 0; i < count; i++){
        const angle = (360 / count) * i;
        svg.appendChild(el("ellipse", {
          cx, cy: cy - radius, rx, ry,
          fill: "none",
          stroke: gold,
          "stroke-width": width,
          opacity,
          transform: `rotate(${angle} ${cx} ${cy})`
        }));
      }
    }

    svg.appendChild(el("circle", {
      cx, cy, r: 158, fill: "none", stroke: gold, "stroke-width": 1, opacity: .45
    }));
    svg.appendChild(el("circle", {
      cx, cy, r: 152, fill: "none", stroke: gold, "stroke-width": 6,
      "stroke-dasharray": "2 13", opacity: .5
    }));

    petalRing(24, 138, 7, 27, .5, 1.1);
    petalRing(12, 108, 12, 34, .62, 1.3);
    petalRing(8, 68, 14, 30, .72, 1.4);

    svg.appendChild(el("circle", {
      cx, cy, r: 94, fill: "none", stroke: gold, "stroke-width": 1, opacity: .5
    }));
    svg.appendChild(el("circle", {
      cx, cy, r: 22, fill: "none", stroke: gold, "stroke-width": 1.6, opacity: .85
    }));

    for (let i = 0; i < 8; i++){
      const a = (Math.PI * 2 / 8) * i;
      svg.appendChild(el("circle", {
        cx: cx + Math.cos(a) * 44,
        cy: cy + Math.sin(a) * 44,
        r: 3.2, fill: gold, opacity: .8
      }));
    }

    host.appendChild(svg);
  })();

  /* =========================================================
     Diya lamps
     ========================================================= */
  (function buildDiyas(){
    const wrap = document.getElementById("diyas");
    const count = 5;

    for (let i = 0; i < count; i++){
      const d = document.createElement("div");
      d.className = "diya";

      const base = Math.min(58, Math.max(34, window.innerWidth * 0.09));
      const w = Math.round(base + Math.random() * 6);
      d.style.setProperty("--w", w + "px");
      d.style.setProperty("--bd", (Math.random() * 2.4).toFixed(2) + "s");
      d.style.setProperty("--fs", (Math.random() * 0.22).toFixed(2) + "s");

      d.innerHTML =
        '<span class="glow"></span>' +
        '<span class="flame"></span>' +
        '<span class="bowl"></span>';

      wrap.appendChild(d);
    }
  })();

  /* =========================================================
     Fireworks
     ========================================================= */
  (function fireworks(){
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    let W = 0, H = 0, DPR = 1;

    const palette = [
      "#ffd36e", "#ff9d2e", "#ff5e8a", "#ff3d6e",
      "#a974ff", "#6ee7ff", "#fff6c0", "#ffb347", "#ff8ad1"
    ];

    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = arr => arr[(Math.random() * arr.length) | 0];

    const rockets = [];
    const particles = [];

    function resize(){
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    function launch(tx, ty){
      const startX = rand(W * 0.2, W * 0.8);
      rockets.push({
        x: startX,
        y: H + 12,
        startX,
        startY: H + 12,
        tx: tx != null ? tx : rand(W * 0.15, W * 0.85),
        ty: ty != null ? ty : rand(H * 0.10, H * 0.46),
        t: 0,
        dur: rand(46, 72),
        color: pick(palette)
      });
    }

    function explode(x, y, tint){
      const count = rand(70, 130) | 0;
      const power = rand(3.2, 6.4);

      for (let i = 0; i < count; i++){
        const angle = Math.random() * Math.PI * 2;
        const speed = power * Math.pow(Math.random(), 0.55);
        const color = Math.random() < 0.28 ? "#fff6c0" : pick(palette);

        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: rand(0.007, 0.017),
          size: rand(0.9, 2.4),
          color: Math.random() < 0.2 ? tint : color
        });
      }

      for (let i = 0; i < 18; i++){
        const angle = Math.random() * Math.PI * 2;
        const speed = power * rand(0.2, 0.6);
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: rand(0.012, 0.025),
          size: rand(1.6, 3.2),
          color: "#fff6c0"
        });
      }
    }

    let last = performance.now();

    function frame(now){
      const dt = Math.min((now - last) / 16.667, 3);
      last = now;

      // Fade existing pixels so trails form, while letting the page show through.
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "rgba(0,0,0,0.16)";
      ctx.fillRect(0, 0, W, H);

      ctx.globalCompositeOperation = "lighter";

      // Rockets
      for (let i = rockets.length - 1; i >= 0; i--){
        const r = rockets[i];
        r.t += dt;

        const p = Math.min(r.t / r.dur, 1);
        const ease = 1 - Math.pow(1 - p, 2.2);
        r.x = r.startX + (r.tx - r.startX) * ease;
        r.y = r.startY + (r.ty - r.startY) * ease;

        // sparkle trail
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = r.color;
        ctx.beginPath();
        ctx.arc(r.x, r.y, 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 0.28;
        ctx.beginPath();
        ctx.arc(r.x + rand(-1, 1), r.y + rand(2, 6), rand(0.6, 1.8), 0, Math.PI * 2);
        ctx.fill();

        if (p >= 1){
          explode(r.x, r.y, r.color);
          rockets.splice(i, 1);
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--){
        const pt = particles[i];

        pt.vx *= 0.984;
        pt.vy = pt.vy * 0.984 + 0.045 * dt;
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.life -= pt.decay * dt;

        if (pt.life <= 0){
          particles.splice(i, 1);
          continue;
        }

        const alpha = Math.max(pt.life, 0);
        const size = pt.size * (0.4 + pt.life * 0.6);

        // soft halo
        ctx.globalAlpha = alpha * 0.16;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, size * 4, 0, Math.PI * 2);
        ctx.fill();

        // core
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // auto celebrations
    setTimeout(() => { launch(); setTimeout(() => launch(), 260); }, 500);
    setInterval(() => {
      launch();
      if (Math.random() > 0.55) {
        setTimeout(() => launch(), rand(180, 520));
      }
    }, 1150);

    // click / tap to launch
    window.addEventListener("pointerdown", e => {
      launch(e.clientX, e.clientY);
    });
  })();
</script>
</body>
</html>
